<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Tibbiy Laboratoriya Tizimi</title>
    <meta name="description" content="Tibbiy laboratoriya boshqaruv tizimi - bemorlarni ro'yxatdan o'tkazish, tahlillar va natijalarni boshqarish">


    <!--
      Applies the saved theme before the first paint. next-themes only gets to
      run once React has mounted, so without this a dark-mode user is shown a
      white splash for the length of the download and then blinked to dark.
      Same class and storage key next-themes uses, so the two agree.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* private mode / storage disabled — light is the default anyway */
      }
    </script>


  </head>
  <body>
    <div id="root"></div>



    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
